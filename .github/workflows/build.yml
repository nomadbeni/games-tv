name: Build

# Minden pushnál: unit tesztek, Playwright-tesztek, aláírt release APK artifactként.
# v* címkénél GitHub Release is készül az APK-val.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a versionCode a commitok száma
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1

      - name: Aláírókulcs a Secretsből
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMESTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Nincs GAMESTV_KEYSTORE_BASE64 secret, a release APK aláíratlan lesz."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GAMESTV_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Teszt és release build
        env:
          GAMESTV_STORE_PASSWORD: ${{ secrets.GAMESTV_STORE_PASSWORD }}
          GAMESTV_KEY_ALIAS: ${{ secrets.GAMESTV_KEY_ALIAS }}
          GAMESTV_KEY_PASSWORD: ${{ secrets.GAMESTV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test lint assembleRelease

      - name: Kulcs törlése
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: APK elnevezése
        run: |
          mkdir -p dist
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" "dist/mini-games-tv-$(git rev-list --count HEAD).apk"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mini-games-tv-apk
          path: dist/*.apk
          if-no-files-found: error

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright-tesztek (élő oldal)
        run: npx playwright test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, js]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mini-games-tv-apk
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
